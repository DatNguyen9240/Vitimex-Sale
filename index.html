  <!-- ── Clock & misc inline ──────────────────────────────────── -->
  <script>
    // Live clock
    function updateClock() {
      const el = document.getElementById('clock-display');
      if (el) {
        const d = new Date();
        el.textContent = d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }
      const tl = document.getElementById('toolbar-datetime');
      if (tl) {
        const d = new Date();
        tl.textContent = d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ── Sidebar Resize Logic ────────────────────────────────────────────────
    $(() => {
      const $resizer = $('#sidebar-resizer');
      const $sidebar = $('#payment-sidebar');
      if (!$resizer.length || !$sidebar.length) return;

      let isResizing = false;
      let _minW = 220; // fallback

      // Load saved width tương ứng với thiết bị
      const isTablet = window.innerWidth < 1199;
      const lsKey = isTablet ? 'vitimex-sidebar-w-tab' : 'vitimex-sidebar-w-desk';
      const savedWidth = localStorage.getItem(lsKey);
      
      if (savedWidth) {
        // Rào biên an toàn ngay lúc load
        const sw = parseFloat(savedWidth);
        const maxWidthLimit = isTablet ? 380 : 480;
        const maxW = Math.min(window.innerWidth * 0.5, maxWidthLimit);
        const finalW = Math.max(200, Math.min(sw, maxW));
        document.documentElement.style.setProperty('--sidebar-w', finalW + 'px');
      } else {
        // Trả về mặc định sạch sẽ nếu chưa từng kéo
        document.documentElement.style.removeProperty('--sidebar-w');
      }

      // Snapshot content natural width khi bắt đầu kéo
      function captureMinW() {
        const body = $sidebar.find('.payment-body')[0];
        if (body) {
          // Tạm thời expand sidebar để đo scrollWidth thực
          const prev = $sidebar[0].style.width;
          $sidebar[0].style.width = 'max-content';
          _minW = Math.ceil($sidebar[0].scrollWidth);
          $sidebar[0].style.width = prev;
        }
      }

      $resizer.on('mousedown touchstart', (e) => {
        isResizing = true;
        $resizer.addClass('active');
        $('body').css('cursor', 'col-resize').css('user-select', 'none');
        captureMinW(); 
      });

      $(document).on('mousemove touchmove', (e) => {
        if (!isResizing) return;
        // Hỗ trợ cả thao tác chạm trên Tablet giả lập
        const clientX = e.type.includes('touch') ? (e.touches ? e.touches[0].clientX : e.originalEvent.touches[0].clientX) : e.clientX;
        const offsetRight = window.innerWidth - clientX;
        
        // Giới hạn max: 45% màn hình, nhưng không vượt quá 480px (Desktop) hoặc 380px (Tablet)
        const maxWidthLimit = window.innerWidth < 1199 ? 380 : 480;
        const maxW = Math.min(window.innerWidth * 0.5, maxWidthLimit);
        
        // Cố định minW an toàn thay vì phụ thuộc vào thẻ max-content (có thể bung sai số)
        const safeMinW = Math.min(_minW, 260); // Chỉ đo _minW đến tối đa 260px 

        // Gò ép (clamp) offsetRight vào khoảng [safeMinW, maxW]
        let newW = Math.max(safeMinW, Math.min(offsetRight, maxW));
        document.documentElement.style.setProperty('--sidebar-w', newW + 'px');
      }).on('mouseup touchend touchcancel', () => {
        if (isResizing) {
          isResizing = false;
          $resizer.removeClass('active');
          $('body').css('cursor', '').css('user-select', '');
          const currentW = document.documentElement.style.getPropertyValue('--sidebar-w');
          if (currentW) {
            const isTab = window.innerWidth < 1199;
            localStorage.setItem(isTab ? 'vitimex-sidebar-w-tab' : 'vitimex-sidebar-w-desk', currentW);
          }
        }
      });
    });

    // ── Mobile: Show/hide FAB + drawer logic ───────────────────────────────────
    function isMobile() { return window.innerWidth < 768; }

    function openSidebar() {
      $('#payment-sidebar').addClass('open');
      $('#sidebar-overlay').addClass('visible');
      document.body.style.overflow = 'hidden';
    }
    function closeSidebar() {
      $('#payment-sidebar').removeClass('open');
      $('#sidebar-overlay').removeClass('visible');
      document.body.style.overflow = '';
    }

    function updateMobileFab() {
      const fab = document.getElementById('mobile-checkout-fab');
      if (!fab) return;
      if (isMobile()) {
        fab.style.display = 'flex';
        // sync total amount to FAB
        try {
          const order = OrderManager.getActive();
          const opts = {};
          const calc = OrderManager.calcOrder(order, opts);
          document.getElementById('fab-amount').textContent = Fmt.currency(calc.total);
        } catch (e) { }
      } else {
        fab.style.display = 'none';
        closeSidebar();
      }
    }

    // Open drawer on FAB click
    document.addEventListener('click', function (e) {
      if (e.target.closest('#mobile-checkout-fab')) openSidebar();
      if (e.target.id === 'sidebar-overlay') closeSidebar();
      if (e.target.id === 'btn-checkout') {
        setTimeout(closeSidebar, 700); // close after checkout
      }
    });

    // Touch swipe down to close drawer
    let _touchStartY = 0;
    document.getElementById('payment-sidebar').addEventListener('touchstart', function (e) {
      _touchStartY = e.touches[0].clientY;
    }, { passive: true });
    document.getElementById('payment-sidebar').addEventListener('touchend', function (e) {
      const diff = e.changedTouches[0].clientY - _touchStartY;
      if (diff > 80) closeSidebar();
    }, { passive: true });

    // Update FAB on resize
    window.addEventListener('resize', updateMobileFab);
    // Initial check
    updateMobileFab();

    // Sync FAB amount whenever totals update
    document.addEventListener('vitimex:fab-update', function (e) {
      const el = document.getElementById('fab-amount');
      if (el && e.detail) el.textContent = e.detail.total;
    });

    // ── Clear order ─────────────────────────────────────────────────────────────
    document.addEventListener('click', function (e) {
      if (e.target.closest('#btn-clear-order')) {
        const order = OrderManager.getActive();
        if (order.items.length === 0) return;
        if (confirm('Xóa toàn bộ sản phẩm trong đơn hàng?')) {
          order.items = [];
          order.payments = [{ methodId: 'TIENMAT', amount: 0 }];
          document.dispatchEvent(new CustomEvent('vitimex:rerender'));
          updateMobileFab();
        }
      }
    });

    // ── Xử lý User Dropdown & đóng các menu trên toàn màn hình ─────────────────
    document.addEventListener('click', function (e) {
      const userMenu = document.getElementById('user-menu-wrapper');
      const isClickInsideUserMenu = userMenu && userMenu.contains(e.target);

      // Nếu click bên ngoài User Menu, thì đảm bảo đóng User Menu
      if (userMenu && !isClickInsideUserMenu) {
        userMenu.classList.remove('open');
      }

      // Nếu click VÀO User Menu
      if (isClickInsideUserMenu) {
        // Toggle User Menu
        userMenu.classList.toggle('open');
        // Nếu user menu VỪA ĐƯỢC MỞ (open), đi đóng các tb-dropdown khác
        if (userMenu.classList.contains('open')) {
          document.querySelectorAll('.tb-dropdown.open').forEach(el => el.classList.remove('open'));
          document.querySelectorAll('.tb-dropdown-trigger').forEach(el => el.setAttribute('aria-expanded', 'false'));
          const bd = document.getElementById('tb-dropdown-bd');
          if (bd) bd.remove();
        }
      }
    });
  </script>

            </div>
          </div>
          <div class="customer-form-actions">
            <button class="btn btn-warning" onclick="Modal.hide('modal-add-customer')">
              ⏪ Thoát
            </button>
            <button class="btn btn-primary" id="btn-save-customer" type="button">
              💾 Lưu
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Modal: Customer Selection ────────────────────────── -->
  <div id="modal-customer-selection" class="modal-overlay">
    <div class="modal-box modal-lg">
      <div class="modal-header">
        <h3 class="modal-title">Chọn khách hàng</h3>
        <button class="modal-close" onclick="Modal.hide('modal-customer-selection')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-search-wrap" style="margin-bottom: 16px;">
          <input type="text" id="cust-modal-search" class="form-input" placeholder="Tìm tên hoặc số điện thoại..." style="width: 100%; padding: 10px 15px; font-size: 1rem;">
        </div>
        <div class="table-responsive" style="max-height: 480px; overflow-y: auto; border: 1px solid var(--color-border); border-radius: var(--radius-md);">
          <table class="cust-modal-table" style="width: 100%; border-collapse: collapse;">
            <thead style="position: sticky; top: 0; background: #f3f4f6; z-index: 10; border-bottom: 1px solid var(--color-border); text-align: left;">
              <tr>
                <th style="padding: 12px 16px; font-size: 0.8rem; text-transform: uppercase; color: #6b7280;">ObjectID</th>
                <th style="padding: 12px 16px; font-size: 0.8rem; text-transform: uppercase; color: #6b7280;">Tên khách hàng</th>
                <th style="padding: 12px 16px; font-size: 0.8rem; text-transform: uppercase; color: #6b7280;">Số điện thoại</th>
                <th style="padding: 12px 16px; font-size: 0.8rem; text-transform: uppercase; color: #6b7280;">Ngày sinh</th>
              </tr>
            </thead>
            <tbody id="cust-modal-tbody">
              <!-- Content rendered by JS -->
            </tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-warning" onclick="Modal.hide('modal-customer-selection')">Thoát</button>
      </div>
    </div>
  </div>

</body>
</html>
