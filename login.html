<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Đăng nhập - Vitimex POS</title>
  
  <link rel="stylesheet" href="src/css/design-tokens.css">
  <link rel="stylesheet" href="src/css/global.css">
  
  <!-- UI Components -->
  <link rel="stylesheet" href="src/css/components/loading.css">
  <link rel="stylesheet" href="src/css/components/input.css">
  <link rel="stylesheet" href="src/css/components/forms.css">
  <link rel="stylesheet" href="src/css/components/card.css">
  
  <link rel="stylesheet" href="src/css/pages/auth.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cash/8.1.5/cash.min.js"></script>
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card card">
      <div class="auth-header">
        <div class="vitimex-logo">
          <span class="v">V</span><span class="i">i</span>timex
        </div>
        <p class="auth-subtitle">Hệ thống quản lý bán hàng chuyên nghiệp</p>
      </div>

      <form id="login-form">
        <div id="login-error" class="alert-error" hidden></div>

        <div class="form-group">
          <label for="username">Tên đăng nhập</label>
          <div class="input-icon-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" id="username" name="username" class="form-input" placeholder="admin / nhanvien" required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="input-icon-wrap">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>

        <div class="form-utils">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me">
            Ghi nhớ
          </label>
          <a href="#" class="forgot-link">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          <span class="btn-text">ĐĂNG NHẬP</span>
          <span class="btn-loader" hidden></span>
        </button>
      </form>

      <div class="auth-footer">
        © 2024 Vitimex Fashion. All rights reserved.
      </div>
    </div>
  </div>

  <script src="src/js/config/api.config.js"></script>
  <script src="src/js/services/http.service.js"></script>
  <script src="src/js/services/auth.service.js"></script>

  <script>
    $(() => {
      // Nếu đã login -> vào trong
      if (AuthService.isAuthenticated()) {
        window.location.href = 'index.html';
        return;
      }

      $('#login-form').on('submit', async function(e) {
        e.preventDefault();
        const user = $('#username').val().trim();
        const pass = $('#password').val();
        const $btn = $('#btn-login');
        const $error = $('#login-error');

        $error.attr('hidden', true);
        $btn.prop('disabled', true).addClass('loading');
        $('.btn-text').text('ĐANG XỬ LÝ...');
        $('.btn-loader').removeAttr('hidden');

        try {
          await AuthService.login(user, pass);
          window.location.href = 'index.html';
        } catch (err) {
          $error.text(err.message || 'Sai tên đăng nhập hoặc mật khẩu').removeAttr('hidden');
          $btn.prop('disabled', false).removeClass('loading');
          $('.btn-text').text('ĐĂNG NHẬP');
          $('.btn-loader').attr('hidden', true);
        }
      });
    });
  </script>
</body>
</html>
