<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Vitimex POS</title>
  <link rel="stylesheet" href="src/css/design-tokens.css">
  <style>
    body { font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f5f5; margin: 0; }
    .offline-box { text-align: center; padding: 60px 40px; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); max-width: 400px; }
    .offline-icon { font-size: 4rem; margin-bottom: 16px; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; color: #111; }
    p { color: #666; margin-bottom: 24px; }
    button { background: #000; color: #fff; border: none; padding: 12px 28px; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #333; }
  </style>
</head>
<body>
  <div class="offline-box">
    <div class="offline-icon">📡</div>
    <h1>Mất kết nối mạng</h1>
    <p>Vui lòng kiểm tra kết nối internet và thử lại.</p>
    <button onclick="location.reload()">Thử lại</button>
  </div>
</body>
</html>
